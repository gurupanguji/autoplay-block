<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autoplay Blocker</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1>Autoplay Blocker</h1>
    <label class="switch-row" for="global-toggle">
      <span>Block autoplay everywhere</span>
      <input id="global-toggle" type="checkbox">
    </label>
    <section aria-labelledby="site-heading">
      <h2 id="site-heading">Current site</h2>
      <p id="site-host">Checking tab…</p>
      <label class="switch-row" for="site-toggle">
        <span>Block autoplay on this site</span>
        <input id="site-toggle" type="checkbox" disabled>
      </label>
      <p id="site-note" class="note" aria-live="polite"></p>
      <button id="reload-button" type="button" hidden>Reload tab to apply</button>
    </section>
    <button id="manage-button" class="link-button" type="button">Manage allowlist</button>
    <p id="status" class="status" role="status"></p>
  </main>
</body>
</html>
